<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAction" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0a0c12" />
    </linearGradient>
    <linearGradient id="shirtAction" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glowAction" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Studio Card -->
  <rect width="400" height="500" rx="16" fill="url(#bgAction)" stroke="#1e2538" stroke-width="2"/>
  
  <!-- Dynamic Motion Wave Lines -->
  <path d="M 70 240 Q 140 210 210 230 T 330 220" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.4" />
  <path d="M 50 280 Q 130 250 210 270 T 350 260" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.3" stroke-dasharray="4 4" />
  
  <!-- Dynamic Motion Top / Remera Silhouette (Waist Length with dynamic sway) -->
  <path d="M 156 145 
           C 130 156, 105 174, 96 206 
           L 128 222 
           C 136 202, 146 190, 153 185 
           L 146 304 
           Q 206 322 258 300 
           L 254 186 
           C 262 192, 272 204, 280 224 
           L 312 208 
           C 302 176, 278 156, 252 145
           C 242 156, 224 164, 204 164
           C 184 164, 166 156, 156 145 Z" 
        fill="url(#shirtAction)" 
        stroke="#60a5fa" 
        stroke-width="2.5" 
        filter="url(#glowAction)" />

  <!-- Dynamic Fabric Folds -->
  <path d="M 170 195 Q 190 250 230 306" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
  <path d="M 195 200 Q 210 245 245 295" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.7" />
  
  <!-- Action Indicator Wave -->
  <circle cx="200" cy="100" r="18" fill="#1e2538" stroke="#3b82f6" stroke-width="2" />
  <path d="M 190 100 Q 200 92 210 100" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />

  <!-- Badge / Label Overlay -->
  <rect x="120" y="420" width="160" height="34" rx="8" fill="#131929" stroke="#3b82f6" stroke-width="1.5" />
  <text x="200" y="442" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="1">EN MOVIMIENTO</text>
</svg>
