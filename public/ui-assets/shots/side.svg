<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0a0c12" />
    </linearGradient>
    <linearGradient id="shirtSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glowSide" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Studio Card -->
  <rect width="400" height="500" rx="16" fill="url(#bgSide)" stroke="#1e2538" stroke-width="2"/>
  
  <!-- Subtle Profile Guide Line -->
  <line x1="220" y1="40" x2="220" y2="400" stroke="#252d44" stroke-dasharray="4 4" stroke-width="1.5" />
  
  <!-- Head Profile Direction Indicator (Facing Right) -->
  <circle cx="210" cy="100" r="18" fill="#1e2538" stroke="#3b82f6" stroke-width="2" />
  <path d="M 204 100 L 216 100 M 212 94 L 218 100 L 212 106" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Side Profile T-Shirt / Top Silhouette (Waist Length) -->
  <path d="M 175 145 
           C 192 142, 212 146, 226 154 
           C 240 172, 246 195, 235 228 
           C 230 240, 232 265, 232 305 
           L 174 305 
           C 172 265, 168 210, 172 175 Z" 
        fill="url(#shirtSide)" 
        stroke="#60a5fa" 
        stroke-width="2.5" 
        filter="url(#glowSide)" />

  <!-- Side Sleeve Drape (Short Sleeve Drop) -->
  <path d="M 195 152 Q 220 185 210 230 L 180 220 Z" fill="#2563eb" stroke="#93c5fd" stroke-width="1.8" />
  
  <!-- Lateral Seam Line -->
  <path d="M 195 230 L 195 302" fill="none" stroke="#93c5fd" stroke-dasharray="3 3" stroke-width="2" />
  
  <!-- Hemline Profile Curve -->
  <line x1="174" y1="305" x2="232" y2="305" stroke="#bfdbfe" stroke-width="2.5" stroke-linecap="round" />

  <!-- Badge / Label Overlay -->
  <rect x="120" y="420" width="160" height="34" rx="8" fill="#131929" stroke="#3b82f6" stroke-width="1.5" />
  <text x="200" y="442" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="1">VISTA LATERAL</text>
</svg>
