<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0a0c12" />
    </linearGradient>
    <linearGradient id="shirtBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glowBack" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Studio Card -->
  <rect width="400" height="500" rx="16" fill="url(#bgBack)" stroke="#1e2538" stroke-width="2"/>
  
  <!-- Subtle Spine Alignment Guide -->
  <line x1="200" y1="40" x2="200" y2="400" stroke="#252d44" stroke-dasharray="4 4" stroke-width="1.5" />
  
  <!-- Rear Top / Remera Silhouette (Proportional Waist/Hip Length) -->
  <path d="M 152 145 
           C 125 156, 102 176, 92 208 
           L 124 224 
           C 132 204, 142 192, 150 186 
           L 152 305 
           Q 200 316 248 305 
           L 250 186 
           C 258 192, 268 204, 276 224 
           L 308 208 
           C 298 176, 275 156, 248 145
           C 238 148, 220 152, 200 152
           C 180 152, 162 148, 152 145 Z" 
        fill="url(#shirtBack)" 
        stroke="#60a5fa" 
        stroke-width="2.5" 
        filter="url(#glowBack)" />

  <!-- Rear High Neckline / Collar Band -->
  <path d="M 166 146 Q 200 155 234 146" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Shoulder Yoke & Central Spine Seam -->
  <path d="M 152 165 Q 200 175 248 165" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="200" y1="155" x2="200" y2="304" stroke="#93c5fd" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 3" />

  <!-- Rear Indicator Icon -->
  <circle cx="200" cy="100" r="18" fill="#1e2538" stroke="#3b82f6" stroke-width="2" />
  <circle cx="200" cy="100" r="8" fill="#3b82f6" opacity="0.6" />

  <!-- Badge / Label Overlay -->
  <rect x="120" y="420" width="160" height="34" rx="8" fill="#131929" stroke="#3b82f6" stroke-width="1.5" />
  <text x="200" y="442" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="1">VISTA TRASERA</text>
</svg>
