<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0a0c12" />
    </linearGradient>
    <linearGradient id="shirtFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glowFront" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Studio Card -->
  <rect width="400" height="500" rx="16" fill="url(#bgFront)" stroke="#1e2538" stroke-width="2"/>
  
  <!-- Subtle Studio Grid & Alignment Lines -->
  <line x1="200" y1="40" x2="200" y2="400" stroke="#252d44" stroke-dasharray="4 4" stroke-width="1.5" />
  
  <!-- Modern T-Shirt / Top Silhouette (Proportional Waist/Hip Length) -->
  <path d="M 152 145 
           C 125 156, 102 176, 92 208 
           L 124 224 
           C 132 204, 142 192, 150 186 
           L 152 305 
           Q 200 318 248 305 
           L 250 186 
           C 258 192, 268 204, 276 224 
           L 308 208 
           C 298 176, 275 156, 248 145
           C 238 156, 220 164, 200 164
           C 180 164, 162 156, 152 145 Z" 
        fill="url(#shirtFront)" 
        stroke="#60a5fa" 
        stroke-width="2.5" 
        filter="url(#glowFront)" />

  <!-- Front Collar Details (Ribbed Neckband & Placket/V-Neck) -->
  <path d="M 166 148 Q 200 178 234 148" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 200 178 L 200 220" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" />
  
  <!-- Sleeve Hem Finishes -->
  <line x1="93" y1="207" x2="123" y2="223" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" />
  <line x1="307" y1="207" x2="277" y2="223" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" />
  
  <!-- Bottom Hem Stitching -->
  <path d="M 154 300 Q 200 312 246 300" fill="none" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Frontal Direction Indicator -->
  <circle cx="200" cy="100" r="18" fill="#1e2538" stroke="#3b82f6" stroke-width="2" />
  <path d="M 194 100 L 206 100 M 200 94 L 200 106" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />

  <!-- Badge / Label Overlay -->
  <rect x="120" y="420" width="160" height="34" rx="8" fill="#131929" stroke="#3b82f6" stroke-width="1.5" />
  <text x="200" y="442" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="1">VISTA FRONTAL</text>
</svg>
