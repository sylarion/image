<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- Pure White Marketplace Cyclorama Background -->
  <rect width="600" height="400" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Infinite Horizon Line -->
  <line x1="0" y1="290" x2="600" y2="290" stroke="#F1F5F9" stroke-width="2" />
  
  <!-- Soft Contact Drop Shadow on Pure White Floor -->
  <ellipse cx="300" cy="325" rx="120" ry="12" fill="#000000" opacity="0.08" />
  <ellipse cx="300" cy="325" rx="80" ry="6" fill="#000000" opacity="0.12" />

  <!-- Symmetrical Garment Silhouette in Pure Studio Lighting -->
  <path d="M 235 90 C 255 105, 345 105, 365 90 L 400 135 L 370 155 L 355 135 L 355 315 L 245 315 L 245 135 L 230 155 L 200 135 Z" 
        fill="#1E293B" 
        stroke="#0F172A" 
        stroke-width="2" />
  
  <!-- Marketplace Badge -->
  <rect x="20" y="20" width="170" height="28" rx="6" fill="#0F172A" />
  <text x="105" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">FONDO BLANCO 100%</text>

  <!-- Clean Bottom Bar -->
  <rect x="0" y="350" width="600" height="50" rx="0 0 16 16" fill="#F8FAFC" />
  <text x="300" y="380" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Reglamentario para Mercado Libre • Sin distracciones</text>
</svg>
