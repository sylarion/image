<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="studioKeylight" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <linearGradient id="softboxBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Studio Background with Softbox Gradient -->
  <rect width="600" height="400" rx="16" fill="url(#studioKeylight)" stroke="#334155" stroke-width="2"/>
  
  <!-- Studio Cyclorama Floor Line & Soft Gradient -->
  <line x1="0" y1="280" x2="600" y2="280" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" />
  
  <!-- Subtle Softbox Light Cone -->
  <polygon points="120,0 260,0 420,380 200,380" fill="url(#softboxBeam)" />

  <!-- Soft Floor Reflection & Shadow -->
  <ellipse cx="300" cy="320" rx="140" ry="16" fill="#000000" opacity="0.4" />
  <ellipse cx="300" cy="320" rx="90" ry="8" fill="#000000" opacity="0.6" />

  <!-- Garment in Studio Lighting -->
  <path d="M 235 90 C 255 105, 345 105, 365 90 L 400 135 L 370 155 L 355 135 L 355 310 L 245 310 L 245 135 L 230 155 L 200 135 Z" 
        fill="#3b82f6" 
        stroke="#60a5fa" 
        stroke-width="2" />

  <!-- Studio Premium Badge -->
  <rect x="20" y="20" width="160" height="28" rx="6" fill="#2563eb" />
  <text x="100" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">ESTUDIO PREMIUM</text>

  <!-- Bottom Bar -->
  <rect x="0" y="350" width="600" height="50" rx="0 0 16 16" fill="#090d16" />
  <text x="300" y="380" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Ciclorama neutro • Sombras graduadas • Luz de estudio</text>
</svg>
