<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="editorialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="architecturalWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
  </defs>

  <!-- Editorial Dark Tone Background -->
  <rect width="600" height="400" rx="16" fill="url(#editorialGrad)" stroke="#3f3f46" stroke-width="2"/>
  
  <!-- Architectural Column / Minimalist Lookbook Backdrop -->
  <polygon points="400,0 520,0 480,400 360,400" fill="url(#architecturalWall)" opacity="0.6" />
  <line x1="360" y1="0" x2="360" y2="400" stroke="#71717a" stroke-width="1.5" />

  <!-- Hard Architectural Shadow -->
  <polygon points="260,310 390,340 370,360 240,330" fill="#000000" opacity="0.7" />

  <!-- Garment in Editorial Silhouette -->
  <path d="M 235 90 C 255 105, 345 105, 365 90 L 400 135 L 370 155 L 355 135 L 355 310 L 245 310 L 245 135 L 230 155 L 200 135 Z" 
        fill="#f43f5e" 
        stroke="#fda4af" 
        stroke-width="2" />

  <!-- Editorial Badge -->
  <rect x="20" y="20" width="170" height="28" rx="6" fill="#e11d48" />
  <text x="105" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">EDITORIAL DE MODA</text>

  <!-- Bottom Bar -->
  <rect x="0" y="350" width="600" height="50" rx="0 0 16 16" fill="#09090b" />
  <text x="300" y="380" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" text-anchor="middle">Contraste dramático • Arquitectura sobria • Lookbook de campaña</text>
</svg>
