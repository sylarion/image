<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGhost" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141826" />
      <stop offset="100%" stop-color="#090b12" />
    </linearGradient>
    <linearGradient id="fabricGhost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="innerCollar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="ghostGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Studio Frame -->
  <rect width="400" height="500" rx="16" fill="url(#bgGhost)" stroke="#1e2538" stroke-width="2"/>
  
  <!-- Subtle Studio Horizon & Floor Line -->
  <line x1="40" y1="380" x2="360" y2="380" stroke="#1e293b" stroke-dasharray="4 4" stroke-width="1.5" />
  <ellipse cx="200" cy="385" rx="90" ry="18" fill="#000000" opacity="0.4" />

  <!-- Ghost Hollow Effect: Inner Back of Neck (Showing absence of human body/head) -->
  <ellipse cx="200" cy="148" rx="36" ry="18" fill="url(#innerCollar)" stroke="#38bdf8" stroke-width="1.5" />
  <!-- Brand Tag inside inner collar -->
  <rect x="190" y="138" width="20" height="12" rx="2" fill="#334155" stroke="#64748b" stroke-width="0.8" />
  <line x1="194" y1="144" x2="206" y2="144" stroke="#94a3b8" stroke-width="0.8" />

  <!-- 3D Hollow Floating Garment (Ghost Mannequin Torso) -->
  <!-- Outer garment body: shoulders, short sleeves, torso with natural drape, hem -->
  <path d="M 152 152 
           C 125 162, 105 180, 95 210 
           L 125 225 
           C 133 205, 142 195, 150 190 
           L 152 300 
           C 152 320, 248 320, 248 300 
           L 250 190 
           C 258 195, 267 205, 275 225 
           L 305 210 
           C 295 180, 275 162, 248 152
           C 240 162, 222 170, 200 170
           C 178 170, 160 162, 152 152 Z" 
        fill="url(#fabricGhost)" 
        stroke="#60a5fa" 
        stroke-width="2.5" 
        filter="url(#ghostGlow)" />

  <!-- 3D Hollow Sleeve Openings (No arms inside) -->
  <ellipse cx="110" cy="217" rx="16" ry="9" fill="url(#innerCollar)" stroke="#38bdf8" stroke-width="1.2" transform="rotate(-25 110 217)" />
  <ellipse cx="290" cy="217" rx="16" ry="9" fill="url(#innerCollar)" stroke="#38bdf8" stroke-width="1.2" transform="rotate(25 290 217)" />

  <!-- Front Collar Cut & 3D Depth Lines -->
  <path d="M 164 152 Q 200 176 236 152" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
  
  <!-- Subtle Fabric Fold Highlights -->
  <path d="M 175 210 Q 185 250 178 295" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 225 210 Q 215 250 222 295" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 152 300 Q 200 315 248 300" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" />

  <!-- Floating indicator icon / badges -->
  <g transform="translate(200, 75)">
    <circle cx="0" cy="0" r="22" fill="#111827" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
    <path d="M -8 -4 L 8 -4 M 0 -12 L 0 4 M -6 8 L 6 8" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Technical Spec Badge -->
  <rect x="90" y="420" width="220" height="34" rx="8" fill="#131929" stroke="#3b82f6" stroke-width="1.5" />
  <text x="200" y="442" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="1">MANIQUÍ INVISIBLE (GHOST)</text>
</svg>
